<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dyeing Direction Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: archive-first. A search bar over a PRO list, a paper-like card form that autosaves, and a code master. */
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#1a2233; --muted:#596378; --line:#d2d8e1;
  --field:#f6f8fb; --accent:#2a3a8c; --accent-ink:#ffffff; --accent-soft:#e1e6f7;
  --ok:#1b7a4b; --warn:#9a5b00; --bad:#b3261e; --bad-soft:#fbe9e7; --warn-soft:#fff3dc;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151e; --surface:#1a2030; --ink:#e5e9f1; --muted:#9aa3b6; --line:#2c3448;
  --field:#141a28; --accent:#93a0f2; --accent-ink:#10142b; --accent-soft:#252d57;
  --ok:#5fd09a; --warn:#f0b35c; --bad:#ff8f86; --bad-soft:#3a1f1f; --warn-soft:#3a2d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151e; --surface:#1a2030; --ink:#e5e9f1; --muted:#9aa3b6; --line:#2c3448;
  --field:#141a28; --accent:#93a0f2; --accent-ink:#10142b; --accent-soft:#252d57;
  --ok:#5fd09a; --warn:#f0b35c; --bad:#ff8f86; --bad-soft:#3a1f1f; --warn-soft:#3a2d14; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);
  padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-size:24px;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:4px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 0;font-weight:500}

.banner{padding:9px 12px;border-radius:5px;margin-bottom:12px;background:var(--warn-soft);color:var(--warn);border:1px solid currentColor}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner button{margin-left:8px}

/* Archive */
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar .grow{flex:1 1 320px;min-width:0}
.in,.f input,.f select,.f textarea,.rt input,.rt select,.mt input,.mt select{
  width:100%;min-width:0;background:var(--field);border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--ink)}
.in{padding:9px 12px;font-size:15px}
.in:focus,.f input:focus,.f textarea:focus,.rt input:focus,.rt select:focus{border-color:var(--accent)}
.meta{color:var(--muted);margin:0 0 8px;font-size:13px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lh,.row{display:grid;grid-template-columns:minmax(120px,1.1fr) 104px 90px minmax(0,2fr) 70px minmax(0,1fr) 84px;gap:12px;align-items:center;padding:10px 14px}
.lh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:500}
.row{border-bottom:1px solid var(--line);cursor:pointer}
.row:last-of-type{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row > *{min-width:0;overflow-wrap:anywhere}
.row .pro{font-family:var(--mono);font-weight:500;font-size:14px}
.row .pro a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent)}
.row small{display:block;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.badge{display:inline-block;font:500 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:3px 5px;border-radius:3px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:12px var(--mono);background:var(--accent-soft);color:var(--ink);padding:2px 6px;border-radius:3px}
.peek{padding:4px 14px 14px;border-bottom:1px solid var(--line);background:var(--field);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:4px 32px}
.peek h4{margin:10px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.peek ul{list-style:none;margin:0;padding:0}
.peek li{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px dotted var(--line)}
.peek li span:last-child{font-family:var(--mono);white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* Card editor */
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0 10px}
.tb .sp{flex:1}
.status{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status[data-s="pending"]::before,.status[data-s="saving"]::before{background:var(--warn)}
.status[data-s="error"]{color:var(--bad)} .status[data-s="error"]::before{background:var(--bad)}
.status[data-s="new"]::before{background:var(--line)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.sheet-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:6px}
.sheet-h h2{font-size:20px}
.sheet-h span{font-size:12px;color:var(--muted)}
.sec{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}
.col{min-width:0}
.f{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px;align-items:center;padding:3px 0}
.f.top{align-items:start}
.f label{color:var(--muted);font-size:13px}
.f textarea{resize:vertical;min-height:112px}
.f .hint{grid-column:2;font-size:12px;margin-top:-2px}
.f .hint.warn{color:var(--warn)}
.f .hint a{color:inherit;font-weight:600}
.ratio{display:flex;align-items:center;gap:8px}
.ratio span{font-family:var(--mono);color:var(--muted);flex:none;white-space:nowrap}
.ro-val{font:500 15px var(--mono);padding:4px 0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:5px}
.rt{border-collapse:collapse;width:100%;min-width:800px}
.rt th{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:7px 6px;background:var(--field);border-bottom:1px solid var(--line)}
.rt td{padding:2px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt tr:last-child td{border-bottom:0}
.rt input,.rt select{border-color:transparent;background:transparent;padding:6px 6px}
.rt input:hover,.rt select:hover{border-color:var(--line)}
.rt .mono,.rt .amt{font-family:var(--mono)}
.c-step{width:62px}.c-code{width:104px}.c-ratio{width:88px}.c-unit{width:84px}.c-amt{width:128px;text-align:right;padding-right:10px!important}
.c-feed{width:90px}.c-act{width:130px}.c-del{width:34px}
.nm{display:block;padding:0 6px;font-size:13px}
.nm.bad{color:var(--bad)}
.amt small{color:var(--muted);margin-left:4px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:4px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.unit-tag{font:500 11px var(--mono);background:var(--accent-soft);padding:2px 6px;border-radius:3px;letter-spacing:0}
.add{margin-top:6px}
.sign{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;margin-top:18px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.print-only{display:none}

/* Master */
.mt{width:100%;border-collapse:collapse}
.mt th{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.mt td{padding:6px 12px;border-bottom:1px solid var(--line)}
.mt td.code{font-family:var(--mono);width:120px}
.mt td.acts{text-align:right;white-space:nowrap;width:130px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.addrow{display:grid;grid-template-columns:130px minmax(0,1fr) 140px auto;gap:8px;padding:12px;background:var(--field);border-bottom:1px solid var(--line)}
.prog{padding:10px 12px;border-radius:5px;background:var(--accent-soft);margin-bottom:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:5px;z-index:40;max-width:calc(100% - 32px)}

@media (max-width:820px){
  .lh{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
  .row .num{text-align:left}
  .g2{grid-template-columns:minmax(0,1fr)}
  .addrow{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .f{grid-template-columns:minmax(0,1fr);gap:2px}.f .hint{grid-column:1}
  .sheet{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  body{background:#fff;color:#000;padding:0;font-size:11px}
  body::before,.no-print{display:none!important}
  .wrap{max-width:none}
  .sheet{border:0;padding:0}
  .f input,.f select,.f textarea,.rt input,.rt select{border:0!important;background:none!important;padding:1px 0!important;color:#000!important;appearance:none;-webkit-appearance:none}
  .f textarea{resize:none}
  .tblwrap{overflow:visible;border:1px solid #000}
  .rt{min-width:0}
  .rt th,.rt td{border-color:#999;color:#000;background:none}
  .print-only{display:flex}
  .x{display:none}
}
</style>

<div class="wrap">
  <header class="top no-print">
    <div>
      <div class="eyebrow">PT Gistex · R&amp;D Processing</div>
      <h1>Dyeing Direction Card</h1>
    </div>
    <nav class="tabs" aria-label="Menu">
      <button type="button" data-tab="arsip">Arsip</button>
      <button type="button" data-tab="kartu">Kartu</button>
      <button type="button" data-tab="master">Master kode</button>
    </nav>
  </header>
  <div id="banners" class="no-print"></div>

  <!-- ARSIP -->
  <section id="v-arsip" hidden>
    <div class="bar">
      <input id="q" class="in grow" type="search" placeholder="Cari nomor PRO, Order No, warna, kode atau nama dyestuff / chemical…" autocomplete="off" aria-label="Cari kartu">
      <select id="fMachine" class="in" style="width:auto" aria-label="Filter mesin"><option value="">Semua mesin</option></select>
      <input id="fMonth" class="in" style="width:auto" type="month" aria-label="Filter bulan">
      <button id="btnNew" type="button" class="btn primary needs-write">Kartu baru</button>
      <button id="btnExport" type="button" class="btn" hidden>Unduh rekap Excel</button>
    </div>
    <p id="count" class="meta"></p>
    <div class="list" id="list"></div>
  </section>

  <!-- KARTU -->
  <section id="v-kartu" hidden>
    <div class="tb no-print">
      <button type="button" class="btn" id="btnBack">← Arsip</button>
      <span id="status" class="status" role="status" data-s="new">Kartu baru, belum disimpan</span>
      <span class="sp"></span>
      <button type="button" class="btn primary" id="btnPrint" title="Buka kartu dalam format siap cetak">Cetak</button>
      <button type="button" class="btn needs-write" id="btnDup" title="Buat kartu baru dengan resep yang sama">Pakai ulang resep</button>
      <button type="button" class="btn danger needs-write" id="btnDel">Hapus</button>
    </div>
    <div id="remote" class="no-print"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-h"><h2>Dyeing Direction Card</h2><span>PT GISTEX</span></div>

      <div class="sec">Batch dan order</div>
      <div class="g2">
        <div class="col" id="colA"></div>
        <div class="col" id="colB"></div>
      </div>

      <div class="sec">Mesin dan proses</div>
      <div class="g2">
        <div class="col">
          <div class="f"><label for="f-dyeingPattern">Dyeing Pattern</label><input id="f-dyeingPattern" data-k="dyeingPattern"></div>
          <div class="f top"><label for="f-processPattern">Process Pattern</label><textarea id="f-processPattern" data-k="processPattern" rows="5"></textarea></div>
        </div>
        <div class="col">
          <div class="f"><label for="f-mainPump">Main Pump</label><input id="f-mainPump" data-k="mainPump"></div>
          <div class="f"><label for="f-fabricSpeed">Fabric Speed</label><input id="f-fabricSpeed" data-k="fabricSpeed"></div>
          <div class="f"><label for="f-reelTorque">Reel Torque</label><input id="f-reelTorque" data-k="reelTorque"></div>
          <div class="f"><label for="f-customer">Customer</label><input id="f-customer" data-k="customer" list="dl-customer"></div>
          <div class="f"><label for="f-ratio">Water Ratio</label><div class="ratio"><span>1 :</span><input id="f-ratio" data-k="ratio" type="number" step="any" inputmode="decimal"></div></div>
          <div class="f"><label>Amount</label><div class="ro-val" id="amount">–</div></div>
        </div>
      </div>

      <div class="sec">Resep</div>
      <div class="g2">
        <div class="f"><label for="f-recipeNo">Recipe No</label><input id="f-recipeNo" data-k="recipeNo"></div>
        <div class="f"><label for="f-recipeName">Recipe Name</label><input id="f-recipeName" data-k="recipeName"></div>
      </div>

      <div class="sec">Dyestuff <span class="unit-tag">% owf</span></div>
      <div class="tblwrap"><table class="rt" id="t-dyes"></table></div>
      <button type="button" class="btn add no-print needs-write" data-add="dyes">+ Baris dyestuff</button>

      <div class="sec">Chemical <span class="unit-tag">g/L</span></div>
      <div class="tblwrap"><table class="rt" id="t-chems"></table></div>
      <button type="button" class="btn add no-print needs-write" data-add="chems">+ Baris chemical</button>

      <div class="sec">Memo</div>
      <div class="f top" style="grid-template-columns:minmax(0,1fr)"><textarea id="f-memo" data-k="memo" rows="3" aria-label="Memo"></textarea></div>

      <div class="sign">
        <label style="display:flex;gap:8px;align-items:center">Pembuat <input id="f-maker" data-k="maker" list="dl-maker" style="width:220px"></label>
        <span class="print-only" id="printDate"></span>
      </div>
    </div>
  </section>

  <!-- MASTER -->
  <section id="v-master" hidden>
    <div class="bar">
      <input id="mq" class="in grow" type="search" placeholder="Cari kode atau nama…" aria-label="Cari kode" autocomplete="off">
      <div class="seg" role="group" aria-label="Kelompok">
        <button type="button" data-g="all" aria-pressed="true">Semua</button>
        <button type="button" data-g="dye" aria-pressed="false">Dyestuff</button>
        <button type="button" data-g="chem" aria-pressed="false">Chemical</button>
      </div>
      <button type="button" class="btn needs-write" id="btnAddCode">Tambah kode</button>
      <label class="btn needs-write" id="lblImport" hidden>Impor Excel<input id="fileImport" type="file" accept=".xlsx,.xls,.csv" hidden></label>
      <button type="button" class="btn" id="btnExportMaster" hidden>Unduh Excel</button>
    </div>
    <div id="importBox"></div>
    <p id="mcount" class="meta"></p>
    <div class="list" style="overflow-x:auto" id="mlist"></div>
  </section>
</div>

<datalist id="dl-dye"></datalist><datalist id="dl-chem"></datalist>
<datalist id="dl-machine"></datalist><datalist id="dl-customer"></datalist><datalist id="dl-maker"></datalist>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var DYE_ROWS=11, CHEM_ROWS=15;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var fmt=function(n,d){return n==null||!isFinite(n)?'':n.toLocaleString('id-ID',{maximumFractionDigits:d==null?2:d})};
var today=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var fmtDate=function(s){if(!s)return '';var d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})};
var newId=function(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var lsGet=function(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
var lsSet=function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

var COL_A=[['machine','Machine','text','dl-machine'],['pro','Batch No. (PRO)','text'],['batchName','Batch Name','text'],['codeFabric','Code Fabric','text'],['right','Right','text'],['left','Left','text'],['weight','Weight (kg)','number'],['gy','g/y','number'],['pieces','Pieces','number'],['material','Material','text']];
var COL_B=[['date','Date','date'],['orderNo','Order No.','text'],['orderName','Order Name','text'],['colorNo','Color No','text'],['colorName','Color Name','text'],['hue','Hue','text'],['nozzle','Nozzle','text'],['nozzlePrs','Nozzle Prs','text']];
var TEXT_KEYS=['machine','pro','batchName','codeFabric','right','left','weight','gy','pieces','material','date','orderNo','orderName','colorNo','colorName','hue','nozzle','nozzlePrs','dyeingPattern','processPattern','mainPump','fabricSpeed','reelTorque','customer','ratio','recipeNo','recipeName','memo','maker'];

var state={cards:new Map(),chems:new Map(),cur:null,dirty:false,writable:true,local:false,loaded:{cards:false,chems:false},open:new Set(),mg:'all',editCode:null,adding:false,imp:null,view:''};
var DB=null, saveTimer=null, saving=false, again=false;

/* ---------- store: shared db, or this browser only ---------- */
function persistLocal(){lsSet('ddc:cards',Array.from(state.cards.values()));lsSet('ddc:chems',Array.from(state.chems.values()))}
var store={
  setCard:function(c){c=JSON.parse(JSON.stringify(c));if(DB)return DB.doc('cards/'+c.id).set(c);state.cards.set(c.id,c);persistLocal();onCards();return Promise.resolve()},
  delCard:function(id){if(DB)return DB.doc('cards/'+id).delete();state.cards.delete(id);persistLocal();onCards();return Promise.resolve()},
  setChem:function(c){if(DB)return DB.doc('chemicals/'+c.code).set(c);state.chems.set(c.code,c);persistLocal();onChems();return Promise.resolve()},
  delChem:function(code){if(DB)return DB.doc('chemicals/'+code).delete();state.chems.delete(code);persistLocal();onChems();return Promise.resolve()}
};

function banner(id,text,cls,action){
  var box=$('#banners'),el=document.getElementById('b-'+id);
  if(!text){if(el)el.remove();return}

/* ---------- routing ---------- */
function route(){
  var h=(location.hash||'').replace(/^#/,'');
  if(h==='master')return show('master');
  if(h.indexOf('kartu')===0){
    var id=h.slice(6);
    if(!id){if(!state.cur||state.cur.created)startNew();return show('kartu')}
    if(state.cur&&state.cur.id===id)return show('kartu');
    if(state.cards.has(id)){loadCard(state.cards.get(id),true);return show('kartu')}
    if(!state.loaded.cards){show('kartu');return}
    toast('Kartu tidak ditemukan');location.hash='arsip';return;
  }
  show('arsip');
}
function show(v){
  if(state.view==='kartu'&&v!=='kartu'&&state.dirty)flush();

  ['arsip','kartu','master'].forEach(function(n){$('#v-'+n).hidden=n!==v});
  $$('.tabs button').forEach(function(b){if(b.dataset.tab===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(v==='arsip')renderArchive();
  if(v==='master')renderMaster();

function lineG(row,b){var x=parseFloat(row.ratio);if(!isFinite(x))return null;if(row.unit==='%')return isFinite(b.w)?x/100*b.w*1000:null;return isFinite(b.L)?x*b.L:null}

/* ---------- autosave ---------- */
function touch(){
  var c=state.cur;state.dirty=true;
  if(c.maker)lsSet('ddc:maker',c.maker);if(c.machine)lsSet('ddc:machine',c.machine);
  setStatus('pending');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
function payload(){
  var c=JSON.parse(JSON.stringify(state.cur));delete c.created;
  c.dyes=c.dyes.filter(function(r){return !isBlank(r)});c.chems=c.chems.filter(function(r){return !isBlank(r)});
  c.updatedAt=Date.now();if(!c.createdAt)c.createdAt=c.updatedAt;state.cur.createdAt=c.createdAt;return c;
}
async function flush(){
  clearTimeout(saveTimer);
  if(!state.dirty||!state.cur)return;
  if(saving){again=true;return}
  saving=true;
  try{
    do{
      again=false;state.dirty=false;setStatus('saving');
      var p=payload();state.cur.updatedAt=p.updatedAt;
      await store.setCard(p);state.cur.created=true;
      if(location.hash==='#kartu')history.replaceState(null,'','#kartu-'+p.id);
    }while(again||state.dirty);
    setStatus('saved');$('#btnDel').hidden=!state.writable;
  }catch(e){state.dirty=true;setStatus('error',e)}
  finally{saving=false}
}
function setStatus(s,e){

  var t={new:'Kartu baru, belum disimpan',pending:'Mengetik…',saving:'Menyimpan…',saved:'Tersimpan otomatis'}[s];
  if(s==='saved'){var d=new Date();t+=' · '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}
  if(s==='error'){
    var code=e&&e.code;
    t=code==='invalid_argument'?'Tidak punya izin menyimpan. Minta akses Contributor.':'Gagal menyimpan'+(code?' ('+code+')':'')+'. Data masih ada di layar.';
    el.textContent=t;var b=document.createElement('button');b.type='button';b.className='lnk';b.textContent='Coba lagi';b.onclick=flush;el.appendChild(b);return;
  }
  el.textContent=t;
}

  return out.map(function(x){var n=chemName(x.r.code);return {k:x.k,code:String(x.r.code||''),name:n||'',ratio:x.r.ratio,unit:x.r.unit}});

  return [c.pro,c.orderNo,c.orderName,c.batchName,c.colorNo,c.colorName,c.customer,c.machine,c.codeFabric,c.recipeNo,c.recipeName,c.memo,c.maker,c.hue,c.material]
   .concat(lines(c).map(function(l){return l.code+' '+l.name})).join(' ').toLowerCase();

  }).sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))||(b.updatedAt||0)-(a.updatedAt||0)});
  var total=state.cards.size;
  $('#count').textContent=!state.loaded.cards?'Memuat arsip…':(list.length===total?total+' kartu':list.length+' dari '+total+' kartu');
  var box=$('#list');
  if(!state.loaded.cards){box.innerHTML='<div class="empty">Memuat arsip…</div>';return}
  if(!list.length){
    box.innerHTML=total?'<div class="empty"><strong>Tidak ada kartu yang cocok</strong>Coba nomor PRO lain, atau cari dengan kode / nama dyestuff.</div>'
      :'<div class="empty"><strong>Arsip masih kosong</strong>Klik “Kartu baru”. Setiap kartu tersimpan otomatis dan bisa dicari lagi dengan nomor PRO.</div>';
    return;
  }
  box.innerHTML='<div class="lh"><div>PRO</div><div>Tanggal</div><div>Mesin</div><div>Warna / Order</div><div style="text-align:right">Kg</div><div>Customer</div><div></div></div>'+
  list.map(function(c){
    var ls=lines(c),chips='';
    if(toks.length){
      var hit=ls.filter(function(l){var s=(l.code+' '+l.name).toLowerCase();return toks.some(function(t){return s.indexOf(t)>-1})}).slice(0,4);
      chips=hit.length?'<div class="chips">'+hit.map(function(l){return '<span class="chip">'+esc(l.code)+' '+esc(l.name)+' · '+esc(fmt(parseFloat(l.ratio),3))+' '+esc(l.unit)+'</span>'}).join('')+'</div>':'';
    }
    var open=state.open.has(c.id);
    var peek='';
    if(open){
      var li=function(k){var a=ls.filter(function(l){return l.k===k});return a.length?'<ul>'+a.map(function(l){return '<li><span>'+esc(l.code)+' '+esc(l.name)+'</span><span>'+esc(fmt(parseFloat(l.ratio),3))+' '+esc(l.unit)+'</span></li>'}).join('')+'</ul>':'<div class="meta">Kosong</div>'};
      peek='<div class="peek"><div><h4>Dyestuff</h4>'+li('dyes')+'</div><div><h4>Chemical</h4>'+li('chems')+'</div></div>';
    }
    return '<div class="row" data-id="'+esc(c.id)+'">'+
      '<div class="pro"><a href="#kartu-'+esc(c.id)+'">'+esc(c.pro||'(tanpa PRO)')+'</a>'+(c.contoh?'<span class="badge">Contoh</span>':'')+'</div>'+
      '<div>'+esc(fmtDate(c.date))+'</div><div>'+esc(c.machine||'')+'</div>'+
      '<div><strong>'+esc(c.colorNo||'')+'</strong> '+esc(c.colorName||'')+'<small>'+esc([c.orderNo,c.orderName].filter(Boolean).join(' · '))+'</small>'+chips+'</div>'+
      '<div class="num">'+esc(fmt(parseFloat(c.weight)))+'</div><div>'+esc(c.customer||'')+'</div>'+
      '<div><button type="button" class="lnk" data-peek="'+esc(c.id)+'" aria-expanded="'+open+'">Resep '+(open?'▴':'▾')+'</button></div></div>'+peek;
  }).join('');
}
$('#list').addEventListener('click',function(e){
  var p=e.target.closest('[data-peek]');
  if(p){var id=p.dataset.peek;if(state.open.has(id))state.open.delete(id);else state.open.add(id);renderArchive();return}
  if(e.target.closest('a'))return;
  var r=e.target.closest('.row');if(r)location.hash='kartu-'+r.dataset.id;
});
['q','fMachine','fMonth'].forEach(function(id){$('#'+id).addEventListener('input',renderArchive)});

/* ---------- master kode ---------- */
function onChems(){
  var d=[],c=[];
  Array.from(state.chems.values()).sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(x){
    var o='<option value="'+esc(x.code)+'" label="'+esc(x.name)+'">'+esc(x.name)+'</option>';(x.group==='chem'?c:d).push(o)});
  $('#dl-dye').innerHTML=d.join('')+c.join('');$('#dl-chem').innerHTML=c.join('')+d.join('');
  $('#lblImport').hidden=!window.XLSX||!state.writable;$('#btnExportMaster').hidden=!window.XLSX||!state.chems.size;
  if(state.cur)recalc();
  if(state.view==='master')renderMaster();
}
function renderMaster(){
  var q=$('#mq').value.trim().toLowerCase(),g=state.mg;
  var all=Array.from(state.chems.values()).sort(function(a,b){return (a.group===b.group?0:a.group==='chem'?1:-1)||a.name.localeCompare(b.name)});
  var list=all.filter(function(x){return (g==='all'||x.group===g)&&(!q||(x.code+' '+x.name).toLowerCase().indexOf(q)>-1)});
  $('#mcount').textContent=!state.loaded.chems?'Memuat…':list.length+' dari '+all.length+' kode';
  var h='<table class="mt"><thead><tr><th>Kode</th><th>Nama</th><th>Kelompok</th><th></th></tr></thead><tbody>';
  if(state.adding)h+='<tr><td colspan="4" style="padding:0"><div class="addrow"><input id="nCode" placeholder="Kode" inputmode="numeric" aria-label="Kode baru"><input id="nName" placeholder="Nama dyestuff / chemical" aria-label="Nama"><select id="nGroup" aria-label="Kelompok"><option value="dye">Dyestuff</option><option value="chem">Chemical</option></select><button type="button" class="btn primary" id="nSave">Simpan</button></div></td></tr>';
  list.forEach(function(x){
    if(state.editCode===x.code){
      h+='<tr><td class="code">'+esc(x.code)+'</td><td><input id="eName" value="'+esc(x.name)+'" aria-label="Nama"></td><td><select id="eGroup" aria-label="Kelompok"><option value="dye"'+(x.group!=='chem'?' selected':'')+'>Dyestuff</option><option value="chem"'+(x.group==='chem'?' selected':'')+'>Chemical</option></select></td><td class="acts"><button type="button" class="btn primary" data-esave="'+esc(x.code)+'">Simpan</button> <button type="button" class="lnk" data-ecancel>Batal</button></td></tr>';
    }else{
      h+='<tr><td class="code">'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+(x.group==='chem'?'Chemical':'Dyestuff')+'</td><td class="acts">'+(state.writable?'<button type="button" class="lnk" data-edit="'+esc(x.code)+'">Ubah</button> <button type="button" class="lnk" style="color:var(--bad)" data-delc="'+esc(x.code)+'">Hapus</button>':'')+'</td></tr>';
    }
  });
  h+='</tbody></table>';
  if(!list.length)h='<div class="empty"><strong>'+(all.length?'Tidak ada kode yang cocok':'Daftar kode masih kosong')+'</strong>'+(all.length?'':'Impor dari sheet “Chemical” di spreadsheet, atau tambah kode satu per satu.')+'</div>'+(state.adding?h:'');
  $('#mlist').innerHTML=h;
  if(state.adding&&$('#nCode')&&!renderMaster.f){renderMaster.f=1;$('#nCode').focus()}
}
$('#mq').addEventListener('input',renderMaster);
$$('.seg button').forEach(function(b){b.onclick=function(){state.mg=b.dataset.g;$$('.seg button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});renderMaster()}});
$('#btnAddCode').onclick=function(){state.adding=!state.adding;renderMaster.f=0;renderMaster()};
$('#mlist').addEventListener('click',async function(e){
  var t=e.target;
  if(t.dataset.edit){state.editCode=t.dataset.edit;renderMaster();return}
  if(t.hasAttribute('data-ecancel')){state.editCode=null;renderMaster();return}
  if(t.dataset.esave){
    var nm=$('#eName').value.trim().replace(/\s+/g,' ');if(!nm){toast('Nama tidak boleh kosong');return}
    try{await store.setChem({code:t.dataset.esave,name:nm,group:$('#eGroup').value});state.editCode=null;toast('Tersimpan');renderMaster()}catch(er){toast('Gagal menyimpan ('+(er&&er.code||'error')+')')}return}
  if(t.dataset.delc){
    if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Yakin?';setTimeout(function(){t.dataset.sure='';t.textContent='Hapus'},3000);return}
    try{await store.delChem(t.dataset.delc);toast('Kode dihapus')}catch(er){toast('Gagal menghapus ('+(er&&er.code||'error')+')')}return}
  if(t.id==='nSave'){
    var code=$('#nCode').value.trim(),name=$('#nName').value.trim().replace(/\s+/g,' ');
    if(!/^[A-Za-z0-9._-]+$/.test(code)){toast('Kode hanya boleh huruf, angka, titik, minus');return}
    if(!name){toast('Isi nama');return}
    var had=state.chems.has(code);
    try{await store.setChem({code:code,name:name,group:$('#nGroup').value});toast(had?'Kode sudah ada, nama diperbarui':'Kode ditambahkan');state.adding=false;renderMaster()}catch(er){toast('Gagal menyimpan ('+(er&&er.code||'error')+')')}
  }
});

/* ---------- Excel: import master, export recap ---------- */
async function saveFile(name,wb){
  try{
    var d=window.claude?await window.claude.use('downloads'):null;
    if(!d){toast('Unduhan tidak tersedia di tampilan ini');return}
    var out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    await d.save({filename:name,data:new Uint8Array(out)});toast('File siap disimpan');
  }catch(e){if(!e||e.code!=='declined')toast('Gagal menyiapkan file ('+(e&&e.code||'error')+')')}
}
function num(v){var n=parseFloat(v);return v!==''&&isFinite(n)?n:v}
function sheetFrom(aoa,widths){var ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=widths.map(function(w){return {wch:w}});return ws}
$('#btnExport').onclick=function(){
  var cards=Array.from(state.cards.values()).sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});
  var head=['PRO','Tanggal','Machine','Batch Name','Order No','Order Name','Code Fabric','Color No','Color Name','Hue','Right','Left','Weight (kg)','g/y','Pieces','Material','Nozzle','Nozzle Prs','Dyeing Pattern','Process Pattern','Main Pump','Fabric Speed','Reel Torque','Customer','Water Ratio (1:x)','Amount (L)','Recipe No','Recipe Name','Memo','Pembuat','Diperbarui'];
  var A=[head],B=[['PRO','Tanggal','Order No','Color No','Color Name','Kelompok','Step','Code','Chemical Name','Ratio','Unit','Amount (g)','Feed Spd','Action']];
  cards.forEach(function(c){
    var w=parseFloat(c.weight),r=parseFloat(c.ratio),L=isFinite(w)&&isFinite(r)?w*r:'';
    A.push([c.pro,c.date,c.machine,c.batchName,c.orderNo,c.orderName,c.codeFabric,c.colorNo,c.colorName,c.hue,c.right,c.left,num(c.weight||''),num(c.gy||''),num(c.pieces||''),c.material,c.nozzle,c.nozzlePrs,c.dyeingPattern,c.processPattern,c.mainPump,c.fabricSpeed,c.reelTorque,c.customer,num(c.ratio||''),L,c.recipeNo,c.recipeName,c.memo,c.maker,c.updatedAt?new Date(c.updatedAt).toLocaleString('id-ID'):'']);
    var b={w:w,L:L===''?NaN:L};
    [['dyes','Dyestuff'],['chems','Chemical']].forEach(function(p){(c[p[0]]||[]).forEach(function(x){
      if(isBlank(x))return;var n=chemName(x.code),g=lineG(x,b);
      B.push([c.pro,c.date,c.orderNo,c.colorNo,c.colorName,p[1],x.step,num(String(x.code||'')),n||'',num(x.ratio||''),x.unit,g==null?'':Math.round(g*100)/100,x.feed,x.action]);
    })});
  });
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,sheetFrom(A,head.map(function(h){return Math.max(12,h.length+2)})),'Kartu');
  XLSX.utils.book_append_sheet(wb,sheetFrom(B,[12,12,14,12,22,11,6,9,32,8,6,12,10,14]),'Resep');
  saveFile('Dyeing-Direction-Card_rekap_'+today()+'.xlsx',wb);
};
$('#btnExportMaster').onclick=function(){
  var rows=[['code','chemical','group']];
  Array.from(state.chems.values()).sort(function(a,b){return (a.group===b.group?0:a.group==='chem'?1:-1)||a.name.localeCompare(b.name)})
    .forEach(function(x){rows.push([num(x.code),x.name,x.group==='chem'?'chemical':'dyestuff'])});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,sheetFrom(rows,[10,40,12]),'Chemical');
  saveFile('Master-kode-chemical_'+today()+'.xlsx',wb);
};
$('#fileImport').addEventListener('change',async function(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    var wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    var ws=wb.Sheets['Chemical']||wb.Sheets[wb.SheetNames[0]];
    var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:true});
    var hd=(rows[0]||[]).map(function(x){return String(x).toLowerCase()});
    var ci=hd.findIndex(function(x){return /code|kode/.test(x)}),ni=hd.findIndex(function(x){return /chem|name|nama/.test(x)}),gi=hd.findIndex(function(x){return /group|grup|kelompok/.test(x)});
    if(ci<0)ci=0;if(ni<0)ni=1;
    var out=[],seenBlank=false,bad=0;
    rows.slice(1).forEach(function(r){
      var code=String(r[ci]==null?'':r[ci]).trim(),name=String(r[ni]==null?'':r[ni]).trim().replace(/\s+/g,' ');
      if(!code&&!name){if(out.length)seenBlank=true;return}
      if(!/^[A-Za-z0-9._-]+$/.test(code)||!name){bad++;return}
      var g=seenBlank?'chem':'dye';
      if(gi>=0){g=/chem/i.test(String(r[gi]))?'chem':'dye'}
      out.push({code:code,name:name,group:g});
    });
    state.imp={rows:out,bad:bad};renderImport();
  }catch(er){toast('File tidak bisa dibaca. Pakai .xlsx dengan kolom code dan chemical.')}
});
function renderImport(){
  var box=$('#importBox'),i=state.imp;
  if(!i){box.innerHTML='';return}
  if(i.progress!=null){box.innerHTML='<div class="prog">Mengimpor… '+i.progress+' dari '+i.rows.length+'</div>';return}
  var d=i.rows.filter(function(r){return r.group==='dye'}).length,fresh=i.rows.filter(function(r){return !state.chems.has(r.code)}).length;
  box.innerHTML='<div class="prog">Ditemukan <strong>'+i.rows.length+'</strong> kode ('+d+' dyestuff, '+(i.rows.length-d)+' chemical), '+fresh+' di antaranya baru. Kode yang sudah ada akan diperbarui namanya, tidak ada yang dihapus.'+(i.bad?' '+i.bad+' baris dilewati karena kode atau nama tidak valid.':'')+' <button type="button" class="btn primary" id="impGo">Impor</button> <button type="button" class="btn" id="impNo">Batal</button></div>';
  $('#impNo').onclick=function(){state.imp=null;renderImport()};
  $('#impGo').onclick=runImport;
}
async function runImport(){
  var i=state.imp,idx=0,done=0,err=null;i.progress=0;renderImport();
  async function worker(){while(idx<i.rows.length&&!err){var r=i.rows[idx++];try{await store.setChem(r)}catch(e){err=e;return}i.progress=++done;if(done%10===0)renderImport()}}
  await Promise.all([worker(),worker(),worker(),worker()]);
  state.imp=null;renderImport();
  toast(err?'Impor berhenti di '+done+' kode ('+(err.code||'error')+')':done+' kode diimpor');
}

init();
})();
</script>
